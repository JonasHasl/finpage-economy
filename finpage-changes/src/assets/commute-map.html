<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oslo Commute Isochrone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; }
    #map { width: 100vw; height: 100vh; }

    #controls {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.13);
      width: 310px;
    }

    h2 { font-size: 15px; font-weight: 800; margin-bottom: 14px; color: #1a1a2e; letter-spacing: -0.3px; }

    label {
      font-size: 11px;
      font-weight: 700;
      color: #777;
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    input[type="text"],
    input[type="time"] {
      width: 100%;
      padding: 9px 11px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="time"]:focus {
      border-color: #4361ee;
    }

    .dest-wrap { position: relative; margin-bottom: 14px; }

    #suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1.5px solid #e5e7eb;
      border-top: none;
      border-radius: 0 0 8px 8px;
      z-index: 9999;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
    }

    .suggestion-item {
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transition: background 0.1s;
    }

    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: #f5f7ff; }
    .suggestion-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .suggestion-name { font-weight: 600; color: #1a1a2e; line-height: 1.3; }
    .suggestion-sub { font-size: 11px; color: #999; margin-top: 2px; }

    .mode-buttons { display: flex; gap: 6px; margin-bottom: 14px; }

    .mode-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid #e5e7eb;
      border-radius: 9px;
      background: white;
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
      line-height: 1.4;
    }

    .mode-btn.active {
      border-color: #4361ee;
      background: #4361ee;
      color: white;
      box-shadow: 0 2px 8px rgba(67, 97, 238, 0.25);
    }

    .section-divider { height: 1px; background: #f0f0f0; margin: 4px 0 14px; }

    .threshold-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; }

    .thresh-btn {
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 20px;
      border: 2px solid #e5e7eb;
      background: white;
      cursor: pointer;
      transition: all 0.18s;
    }

    .thresh-btn.active { border-color: transparent; color: white; }
    .thresh-btn[data-min="20"].active { background: #1f77b4; }
    .thresh-btn[data-min="25"].active { background: #2ca02c; }
    .thresh-btn[data-min="30"].active { background: #e6b800; color: #333; }
    .thresh-btn[data-min="35"].active { background: #ff7f0e; }
    .thresh-btn[data-min="40"].active { background: #d62728; }

    .rush-row { display: flex; gap: 6px; margin-bottom: 14px; align-items: center; }

    .rush-time-input {
      width: 100%;
      padding: 7px 9px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .rush-time-input:focus { border-color: #4361ee; }

    #run-btn {
      width: 100%;
      padding: 11px;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.2px;
    }

    #run-btn:hover { background: #3251d4; }
    #run-btn:disabled { background: #b0b8d6; cursor: not-allowed; }

    #status {
      margin-top: 10px;
      font-size: 11px;
      color: #666;
      min-height: 16px;
      text-align: center;
      line-height: 1.5;
    }

    #progress-bar-wrap {
      margin-top: 8px;
      background: #f0f0f0;
      border-radius: 99px;
      height: 4px;
      overflow: hidden;
      display: none;
    }

    #progress-bar {
      height: 100%;
      background: #4361ee;
      border-radius: 99px;
      transition: width 0.3s;
      width: 0%;
    }

    .cache-info {
      margin-top: 10px;
      background: #f8f9ff;
      border: 1px solid #e8eaf6;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 11px;
      color: #666;
    }

    .cache-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }

    .cache-info-row:last-child { margin-bottom: 0; }
    .cache-label { font-weight: 600; color: #555; white-space: nowrap; }
    .cache-value { color: #888; font-size: 10px; flex: 1; text-align: right; }

    .cache-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .cache-badge.fresh { background: #e8f5e9; color: #2e7d32; }
    .cache-badge.stale { background: #fff3e0; color: #e65100; }
    .cache-badge.miss { background: #fce4ec; color: #b71c1c; }
    .cache-badge.ok { background: #e3f2fd; color: #1565c0; }

    .cache-btn-row { display: flex; gap: 6px; margin-top: 8px; }

    .cache-action-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 7px;
      border: 1.5px solid #e5e7eb;
      background: white;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      color: #555;
    }

    .cache-action-btn:hover {
      border-color: #4361ee;
      color: #4361ee;
      background: #f0f3ff;
    }

    .cache-action-btn.danger:hover {
      border-color: #d62728;
      color: #d62728;
      background: #fff5f5;
    }

    .legend {
      position: absolute;
      bottom: 30px;
      right: 16px;
      z-index: 1000;
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.11);
      min-width: 170px;
    }

    .legend-title { font-weight: 800; font-size: 12px; margin-bottom: 8px; color: #1a1a2e; }
    .legend-item { display: flex; align-items: center; gap: 9px; font-size: 12px; margin-bottom: 5px; }
    .legend-color { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
    .legend-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }
    .legend-subtitle { font-weight: 700; font-size: 11px; color: #999; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }

    #drilldown-panel {
      position: absolute;
      bottom: 30px;
      left: 16px;
      z-index: 1000;
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.13);
      min-width: 270px;
      display: none;
    }

    #drilldown-panel .dd-title {
      font-weight: 800;
      font-size: 13px;
      color: #1a1a2e;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }

    #drilldown-panel .dd-sub { font-size: 11px; color: #888; margin-bottom: 10px; }

    .dd-toggle-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .dd-toggle-btn {
      flex: 1;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      border: 1.5px solid #e5e7eb;
      background: white;
      cursor: pointer;
      transition: all 0.15s;
      color: #555;
    }

    .dd-toggle-btn:hover {
      border-color: #4361ee;
      color: #4361ee;
      background: #f5f7ff;
    }

    .dd-toggle-btn.active {
      border-color: #4361ee;
      background: #4361ee;
      color: white;
      box-shadow: 0 2px 8px rgba(67, 97, 238, 0.2);
    }

    .finn-panel {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eef0f4;
    }

    .finn-title {
      font-size: 10px;
      font-weight: 800;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.35px;
      margin-bottom: 8px;
    }

    .finn-btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .finn-btn {
      flex: 1;
      padding: 7px 6px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      border: 1.5px solid #e5e7eb;
      background: white;
      cursor: pointer;
      transition: all 0.15s;
      color: #555;
    }

    .finn-btn:hover:not(:disabled) {
      border-color: #0b57d0;
      color: #0b57d0;
      background: #f4f8ff;
    }

    .finn-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .finn-hint {
      font-size: 10px;
      color: #999;
      line-height: 1.4;
    }

    #drilldown-panel .dd-status { font-size: 11px; color: #666; margin-top: 8px; text-align: center; }

    #drilldown-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #aaa;
      line-height: 1;
    }

    #drilldown-close:hover { color: #333; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <h2>🗺 Oslo Commute Zones</h2>

    <label>Destination</label>
    <div class="dest-wrap">
      <input type="text" id="destination" value="Oslo S" placeholder="Address, stop or place..." autocomplete="off" />
      <div id="suggestions"></div>
    </div>

    <label>Mode</label>
    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="car">🚗 Car</button>
      <button class="mode-btn" data-mode="transit">🚌 Transit</button>
    </div>

    <div class="section-divider"></div>

    <label>Rush Hour Query Time</label>
    <div class="rush-row">
      <input type="time" class="rush-time-input" id="rushTime" value="07:00" />
    </div>

    <div class="section-divider"></div>

    <label>Thresholds (minutes)</label>
    <div class="threshold-row" id="thresholds">
      <button class="thresh-btn active" data-min="20">20</button>
      <button class="thresh-btn active" data-min="25">25</button>
      <button class="thresh-btn active" data-min="30">30</button>
      <button class="thresh-btn active" data-min="35">35</button>
      <button class="thresh-btn active" data-min="40">40</button>
    </div>

    <button id="run-btn">Generate Map</button>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div id="status"></div>

    <div class="cache-info" id="cache-panel">
      <div class="cache-info-row">
        <span class="cache-label">🚉 Stop list</span>
        <span class="cache-value" id="stops-cache-age">—</span>
        <span class="cache-badge miss" id="stops-cache-badge">No cache</span>
      </div>
      <div class="cache-info-row">
        <span class="cache-label">🚌 Transit times</span>
        <span class="cache-value" id="transit-cache-count">—</span>
        <span class="cache-badge miss" id="transit-cache-badge">Empty</span>
      </div>
      <div class="cache-btn-row">
        <button class="cache-action-btn" id="refresh-stops-btn" title="Force re-fetch stop list from Entur now">↺ Refresh stops</button>
        <button class="cache-action-btn danger" id="clear-transit-btn" title="Clear all cached transit query results">🗑 Clear times</button>
      </div>
    </div>
  </div>

  <div id="drilldown-panel">
    <button id="drilldown-close">×</button>
    <div class="dd-title" id="dd-stop-name">Stop name</div>
    <div class="dd-sub" id="dd-stop-sub"></div>

    <div class="dd-toggle-row">
      <button class="dd-toggle-btn active" data-dd-mode="driving">🚗 Drive from stop</button>
      <button class="dd-toggle-btn" data-dd-mode="walking">🚶 Walk from stop</button>
    </div>

    <div class="finn-panel">
      <div class="finn-title">FINN map search in current contour</div>
      <div class="finn-btn-row">
        <button class="finn-btn" id="finn-5-btn" data-mins="5" disabled>🏠 5 min</button>
        <button class="finn-btn" id="finn-10-btn" data-mins="10" disabled>🏠 10 min</button>
        <button class="finn-btn" id="finn-15-btn" data-mins="15" disabled>🏠 15 min</button>
      </div>
      <div class="finn-hint" id="finn-hint">
        Load a stop drill-down to enable FINN map links for the visible drive/walk contours.
      </div>
    </div>

    <div class="dd-status" id="dd-status">Fetching drive zones...</div>
  </div>

  <div class="legend" id="legend" style="display:none">
    <div class="legend-title">Travel Time</div>
  </div>

  <script>
    const MAPBOX_TOKEN = "pk.eyJ1Ijoiam9uYXNoYXMiLCJhIjoiY21ueW5hMTVzMDJ0eDJwc2Rpd2Nvd3g5diJ9.3ay7a5Th6ma1CwKATXMM0w";
    const ENTUR_CLIENT = "jonas-oslo-commute-map";

    const ENTUR_GRAPHQL = "https://api.entur.io/journey-planner/v3/graphql";
    const ENTUR_GEOCODER = "https://api.entur.io/geocoder/v3/autocomplete";
    const MAPBOX_ISO_BASE = "https://api.mapbox.com/isochrone/v1/mapbox";

    const FINN_BASE_URL = "https://www.finn.no/map/realestate/homes/search.html";
    const FINN_DEFAULT_ZOOM = 14;

    const STOPS_JSON_PATH = "./stops-cache.json";
    const TRANSIT_JSON_PATH = "./transit-cache.json";

    const THRESHOLD_COLORS = {
      20: "#1f77b4",
      25: "#2ca02c",
      30: "#e6b800",
      35: "#ff7f0e",
      40: "#d62728"
    };

    const DRIVING_DRILLDOWN_COLORS = {
      5: "#7b2d8b",
      10: "#c44fcd",
      15: "#e8a8f0"
    };

    const WALKING_DRILLDOWN_COLORS = {
      5: "#0f766e",
      10: "#14b8a6",
      15: "#99f6e4"
    };

    const CACHE_PREFIX = "entur_transit_cache_v4_";
    const STOPS_LS_KEY = "entur_stops_cache_v1";
    const STOPS_LS_TTL = 7 * 24 * 60 * 60 * 1000;

    const map = L.map("map").setView([59.91, 10.75], 10);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: "© OpenStreetMap © CARTO",
      maxZoom: 19
    }).addTo(map);

    let activeMode = "car";
    let isochroneLayers = [];
    let drilldownLayers = [];
    let selectedSuggestion = null;
    let transitCacheSeeded = false;
    let autocompleteTimeout = null;
    let lastMapboxCall = 0;

    let currentDrilldownStop = null;
    let currentDrilldownTransitMins = null;
    let currentDrilldownMode = "driving";
    let currentDrilldownFeaturesByMinute = { 5: null, 10: null, 15: null };

    const destInput = document.getElementById("destination");
    const suggestionsEl = document.getElementById("suggestions");

    function safeJsonParse(raw, fallback) {
      try {
        return JSON.parse(raw);
      } catch (err) {
        return fallback;
      }
    }

    function getFeatureProps(feature) {
      return feature && feature.properties ? feature.properties : {};
    }

    function getFeatureCoords(feature) {
      if (
        feature &&
        feature.geometry &&
        Array.isArray(feature.geometry.coordinates) &&
        feature.geometry.coordinates.length >= 2
      ) {
        return feature.geometry.coordinates;
      }
      return [null, null];
    }

    function firstNonEmpty() {
      for (let i = 0; i < arguments.length; i++) {
        const val = arguments[i];
        if (val !== undefined && val !== null && String(val).trim() !== "") {
          return String(val).trim();
        }
      }
      return "";
    }

    function joinNonEmpty(parts, separator) {
      return parts
        .filter(function (p) { return p !== undefined && p !== null && String(p).trim() !== ""; })
        .map(function (p) { return String(p).trim(); })
        .join(separator);
    }

    function buildAddressLabel(address) {
      if (!address) return "";

      const line1 = joinNonEmpty([
        firstNonEmpty(address.streetName),
        firstNonEmpty(address.houseNumber)
      ], " ");

      const line2 = joinNonEmpty([
        firstNonEmpty(address.postalCode),
        firstNonEmpty(address.locality)
      ], " ");

      return joinNonEmpty([line1, line2], ", ");
    }

    function buildSuggestionName(props) {
      const names = props.names || {};
      const address = props.address || {};

      const displayName = firstNonEmpty(names.display);
      if (displayName) return displayName;

      const defaultName = firstNonEmpty(names.default);
      if (defaultName) return defaultName;

      const labelName = firstNonEmpty(names.label);
      if (labelName) return labelName;

      const addressLabel = buildAddressLabel(address);
      if (addressLabel) return addressLabel;

      return "Unknown";
    }

    function buildSuggestionSub(props, mainName) {
      const address = props.address || {};
      const layer = firstNonEmpty(props.layer);
      const source = firstNonEmpty(props.source);

      const addr = buildAddressLabel(address);
      const localityCounty = joinNonEmpty([
        firstNonEmpty(address.locality),
        firstNonEmpty(address.county)
      ], ", ");

      const sub = joinNonEmpty([
        layer,
        addr && addr !== mainName ? addr : "",
        localityCounty && localityCounty !== mainName ? localityCounty : "",
        source
      ], " · ");

      return sub;
    }

    function resetFinnLinks() {
      currentDrilldownFeaturesByMinute = { 5: null, 10: null, 15: null };

      [5, 10, 15].forEach(function (mins) {
        const btn = document.getElementById("finn-" + mins + "-btn");
        btn.disabled = true;
        btn.removeAttribute("data-url");
      });

      document.getElementById("finn-hint").textContent =
        "Load a stop drill-down to enable FINN map links for the visible drive/walk contours.";
    }

    function getOuterRingFromFeature(feature) {
      if (!feature || !feature.geometry) return null;

      const geom = feature.geometry;

      if (geom.type === "Polygon") {
        return Array.isArray(geom.coordinates) && geom.coordinates.length ? geom.coordinates[0] : null;
      }

      if (geom.type === "MultiPolygon") {
        if (
          Array.isArray(geom.coordinates) &&
          geom.coordinates.length &&
          Array.isArray(geom.coordinates[0]) &&
          geom.coordinates[0].length
        ) {
          return geom.coordinates[0][0];
        }
      }

      return null;
    }

    function ringToFinnPolyLocation(ring) {
      if (!Array.isArray(ring) || !ring.length) return "";

      return ring
        .filter(function (coord) {
          return Array.isArray(coord) && coord.length >= 2 && isFinite(coord[0]) && isFinite(coord[1]);
        })
        .map(function (coord) {
          const lon = Number(coord[0]).toFixed(5);
          const lat = Number(coord[1]).toFixed(5);
          return lon + " " + lat;
        })
        .join(",");
    }

    function getFeatureCenterLatLon(feature) {
      try {
        if (!feature || !feature.geometry) return null;
        const center = turf.centroid(feature);
        if (
          center &&
          center.geometry &&
          Array.isArray(center.geometry.coordinates) &&
          center.geometry.coordinates.length >= 2
        ) {
          return {
            lon: Number(center.geometry.coordinates[0]),
            lat: Number(center.geometry.coordinates[1])
          };
        }
      } catch (err) {
        console.warn("Could not compute centroid:", err);
      }
      return null;
    }

    function buildFinnSearchUrlFromFeature(feature) {
      const ring = getOuterRingFromFeature(feature);
      if (!ring) return null;

      const poly = ringToFinnPolyLocation(ring);
      if (!poly) return null;

      const center = getFeatureCenterLatLon(feature);
      if (!center || !isFinite(center.lat) || !isFinite(center.lon)) return null;

      const params = new URLSearchParams({
        lat: center.lat.toFixed(5),
        lon: center.lon.toFixed(5),
        polylocation: poly,
        results: "true",
        zoom: String(FINN_DEFAULT_ZOOM)
      });

      return FINN_BASE_URL + "?" + params.toString();
    }

    function updateFinnLinks(profileMode, stopName) {
      let enabledCount = 0;

      [5, 10, 15].forEach(function (mins) {
        const btn = document.getElementById("finn-" + mins + "-btn");
        const feature = currentDrilldownFeaturesByMinute[mins];
        const url = feature ? buildFinnSearchUrlFromFeature(feature) : null;

        if (url) {
          btn.disabled = false;
          btn.dataset.url = url;
          enabledCount += 1;
        } else {
          btn.disabled = true;
          btn.removeAttribute("data-url");
        }
      });

      const verb = profileMode === "walking" ? "walking" : "driving";
      document.getElementById("finn-hint").textContent = enabledCount
        ? "FINN links open map view with results=true and zoom=14 for the current " + verb + " contour(s) around " + stopName + "."
        : "No usable contour polygons available for FINN links.";
    }

    async function seedTransitCacheFromFile() {
      if (transitCacheSeeded) return;
      transitCacheSeeded = true;

      try {
        const resp = await fetch(TRANSIT_JSON_PATH);
        if (!resp.ok) return;

        const data = await resp.json();
        const entries = data && data.entries ? data.entries : {};
        let seeded = 0;
        let skipped = 0;

        for (const [key, mins] of Object.entries(entries)) {
          if (localStorage.getItem(key) === null) {
            try {
              localStorage.setItem(key, String(mins));
              seeded += 1;
            } catch (err) {
              break;
            }
          } else {
            skipped += 1;
          }
        }

        console.log("📦 Transit cache seeded:", seeded, "new entries,", skipped, "already cached");
        updateCacheUI();
      } catch (err) {
        console.info("transit-cache.json not found or invalid — skipping seed:", err.message);
      }
    }

    function updateCacheUI() {
      try {
        const raw = localStorage.getItem(STOPS_LS_KEY);
        if (raw) {
          const parsed = safeJsonParse(raw, null);
          if (parsed && typeof parsed.timestamp === "number" && Array.isArray(parsed.stops)) {
            const ageDays = ((Date.now() - parsed.timestamp) / 86400000).toFixed(1);
            const fresh = (Date.now() - parsed.timestamp) < STOPS_LS_TTL;
            document.getElementById("stops-cache-age").textContent = parsed.stops.length + " stops · " + ageDays + "d old";

            const badge = document.getElementById("stops-cache-badge");
            badge.textContent = fresh ? "Fresh" : "Stale";
            badge.className = "cache-badge " + (fresh ? "fresh" : "stale");
          } else {
            throw new Error("Invalid stop cache shape");
          }
        } else {
          document.getElementById("stops-cache-age").textContent = "Not cached";
          const badge = document.getElementById("stops-cache-badge");
          badge.textContent = "No cache";
          badge.className = "cache-badge miss";
        }
      } catch (err) {
        document.getElementById("stops-cache-age").textContent = "Cache unreadable";
        const badge = document.getElementById("stops-cache-badge");
        badge.textContent = "Error";
        badge.className = "cache-badge miss";
      }

      const count = Object.keys(localStorage).filter(function (k) {
        return k.indexOf(CACHE_PREFIX) === 0;
      }).length;

      document.getElementById("transit-cache-count").textContent = count > 0 ? count + " entries" : "Empty";
      const tbadge = document.getElementById("transit-cache-badge");
      tbadge.textContent = count > 0 ? "Cached" : "Empty";
      tbadge.className = "cache-badge " + (count > 0 ? "ok" : "miss");
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    function setProgress(pct) {
      const wrap = document.getElementById("progress-bar-wrap");
      const bar = document.getElementById("progress-bar");

      currentDrilldownMode = "driving";
      updateDrilldownToggleUI();
      resetFinnLinks();
    }

    function clearDrilldownLayers() {
      drilldownLayers.forEach(function (layer) {

      });

    function getLayerBounds(layer) {
      if (!layer) return null;

      if (typeof layer.getBounds === "function") {
        try { return layer.getBounds(); } catch (err) {}
      }

      if (typeof layer.getLatLng === "function") {
        try {
          const ll = layer.getLatLng();
          return L.latLngBounds([ll, ll]);
        } catch (err) {}
      }

      return null;

      document.querySelectorAll(".dd-toggle-btn").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.ddMode === currentDrilldownMode);
      });

    function cacheKey(fromId, toKey, rushTime) {
      return CACHE_PREFIX + fromId + "__" + toKey + "__" + rushTime;
    }

    function getCached(fromId, toKey, rushTime) {
      try {
        const val = localStorage.getItem(cacheKey(fromId, toKey, rushTime));
        return val !== null ? parseFloat(val) : null;
      } catch (err) {
        return null;
      }
    }

    function setCache(fromId, toKey, rushTime, mins) {
      try {
        localStorage.setItem(cacheKey(fromId, toKey, rushTime), String(mins));
      } catch (err) {}
    }

    function buildDateTime(timeStr) {
      const parts = timeStr.split(":").map(Number);
      const hh = parts[0];
      const mm = parts[1];

      const now = new Date();
      const candidate = new Date(now);
      candidate.setHours(hh, mm, 0, 0);

      if (candidate <= now) candidate.setDate(candidate.getDate() + 1);
      if (candidate.getDay() === 6) candidate.setDate(candidate.getDate() + 2);
      if (candidate.getDay() === 0) candidate.setDate(candidate.getDate() + 1);

      return candidate.toISOString();
    }

    function getMapboxProfilePath(profileMode) {
      return profileMode === "walking" ? "walking" : "driving-traffic";
    }

    async function fetchSuggestions(text) {
      const url =
        ENTUR_GEOCODER +
        "?q=" + encodeURIComponent(text) +
        "&limit=7" +
        "&lang=no" +
        "&lat=59.91" +
        "&lon=10.75" +
        "&radius=15";

      try {
        const res = await fetch(url, {
          headers: { "ET-Client-Name": ENTUR_CLIENT }
        });

        if (!res.ok) {
          suggestionsEl.style.display = "none";
          return;
        }

        const data = await res.json();
        renderSuggestions(Array.isArray(data.features) ? data.features : []);
      } catch (err) {
        suggestionsEl.style.display = "none";
      }
    }

    function renderSuggestions(features) {
      suggestionsEl.innerHTML = "";

      if (!features.length) {
        suggestionsEl.style.display = "none";
        return;
      }

      features.forEach(function (feature) {
        const props = getFeatureProps(feature);
        const coords = getFeatureCoords(feature);
        const id = firstNonEmpty(props.id);
        const layer = firstNonEmpty(props.layer);
        const isStop = id.indexOf("NSR:") === 0;

        const icon = isStop
          ? "🚉"
          : layer === "address"
            ? "📍"
            : layer === "street"
              ? "🛣️"
              : layer === "place"
                ? "🏙️"
                : "🏢";

        const name = buildSuggestionName(props);
        const sub = buildSuggestionSub(props, name);

        const div = document.createElement("div");
        div.className = "suggestion-item";
        div.innerHTML =
          '<span class="suggestion-icon">' + icon + "</span>" +
          "<div>" +
            '<div class="suggestion-name">' + name + "</div>" +
            (sub ? '<div class="suggestion-sub">' + sub + "</div>" : "") +
          "</div>";

        div.addEventListener("click", function () {
          destInput.value = name;
          selectedSuggestion = {
            lon: coords[0],
            lat: coords[1],
            id: props.id || null,
            name: name,
            isStop: id.indexOf("NSR:StopPlace:") === 0
          };
          suggestionsEl.style.display = "none";
        });

        suggestionsEl.appendChild(div);
      });

      suggestionsEl.style.display = "block";
    }

    async function geocodeDestination(name) {
      const url =
        ENTUR_GEOCODER +
        "?q=" + encodeURIComponent(name) +
        "&limit=5" +
        "&lang=no" +
        "&lat=59.91" +
        "&lon=10.75" +
        "&radius=15";

      const res = await fetch(url, {
        headers: { "ET-Client-Name": ENTUR_CLIENT }
      });

      if (!res.ok) {
        throw new Error("Geocoder error " + res.status);
      }

      const data = await res.json();

      if (!data.features || !data.features.length) {
        throw new Error('Could not find "' + name + '" — try the dropdown');
      }

      const features = data.features;
      const stopFeature = features.find(function (f) {
        const props = getFeatureProps(f);
        return typeof props.id === "string" && props.id.indexOf("NSR:StopPlace:") === 0;
      });

      const best = stopFeature || features[0];
      const props = getFeatureProps(best);
      const coords = getFeatureCoords(best);
      const displayName = buildSuggestionName(props);

      return {
        lon: coords[0],
        lat: coords[1],
        id: props.id || null,
        name: displayName,
        isStop: typeof props.id === "string" && props.id.indexOf("NSR:StopPlace:") === 0
      };
    }

    async function queryEnturPatterns(fromStopId, destination, dateTimeISO) {
      const toClause = destination.isStop && destination.id
        ? 'place: "' + destination.id + '"'
        : "coordinates: { latitude: " + destination.lat + ", longitude: " + destination.lon + " }";

      const query =
        "{" +
          "trip(" +
            'from: { place: "' + fromStopId + '" } ' +
            "to: { " + toClause + " } " +
            'dateTime: "' + dateTimeISO + '" ' +
            "numTripPatterns: 5 " +
            "walkSpeed: 1.3" +
          ") { tripPatterns { duration legs { mode } } }" +
        "}";

      try {
        const res = await fetch(ENTUR_GRAPHQL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ET-Client-Name": ENTUR_CLIENT
          },
          body: JSON.stringify({ query: query })
        });

        const data = await res.json();

        if (data.errors) {
          console.warn("⚠️ Entur errors for", fromStopId, data.errors);
          return [];
        }

        const patterns = data && data.data && data.data.trip && data.data.trip.tripPatterns
          ? data.data.trip.tripPatterns
          : [];

        return patterns.map(function (p) { return p.duration; });
      } catch (err) {
        console.error("❌ queryEnturPatterns failed for", fromStopId, err);
        return [];
      }
    }

    async function fetchMinTransitTime(fromStopId, destination, rushTime) {
      const toKey = destination.id || (destination.lat.toFixed(4) + "," + destination.lon.toFixed(4));
      const cached = getCached(fromStopId, toKey, rushTime);
      if (cached !== null) return cached;

      const results = await queryEnturPatterns(
        fromStopId,
        destination,
        buildDateTime(rushTime)
      );

      if (!results.length) return null;

      const minMins = Math.min.apply(null, results) / 60;
      setCache(fromStopId, toKey, rushTime, minMins);
      updateCacheUI();
      return minMins;
    }

    async function fetchRuterStops(options) {
      const opts = options || {};
      const forceRefresh = !!opts.forceRefresh;

      if (!forceRefresh) {
        try {
          const resp = await fetch(STOPS_JSON_PATH);
          if (resp.ok) {
            const data = await resp.json();
            const stops = Array.isArray(data) ? data : (data && data.stops ? data.stops : []);
            if (Array.isArray(stops) && stops.length > 0) {
              console.log("📦 Stops from stops-cache.json (" + stops.length + " stops)");
              setStatus("Loaded " + stops.length + " stops from pre-baked file ✓");
              return stops;
            }
          }
        } catch (err) {
          console.info("stops-cache.json not found, falling back to localStorage / live fetch:", err.message);
        }
      }

      if (!forceRefresh) {
        try {
          const raw = localStorage.getItem(STOPS_LS_KEY);
          if (raw) {
            const parsed = safeJsonParse(raw, null);
            if (parsed && typeof parsed.timestamp === "number" && Array.isArray(parsed.stops)) {
              const age = Date.now() - parsed.timestamp;
              const ageDays = (age / 86400000).toFixed(1);
              if (age < STOPS_LS_TTL) {
                console.log("💾 Stops from localStorage (" + parsed.stops.length + " stops, " + ageDays + "d old)");
                setStatus("Loaded " + parsed.stops.length + " stops from cache (" + ageDays + "d old) ✓");
                return parsed.stops;
              }
              console.log("♻️ localStorage stop cache expired (" + ageDays + "d), re-fetching…");
            }
          }
        } catch (err) {
          console.warn("localStorage stop cache read failed:", err);
        }
      }

      return fetchStopsFromEntur();
    }

    async function fetchStopsFromEntur() {
      const gridPoints = [];

      for (let lat = 59.4; lat <= 60.2; lat += 0.05) {
        for (let lon = 10.1; lon <= 11.4; lon += 0.07) {
          gridPoints.push({
            lat: Number(lat.toFixed(3)),
            lon: Number(lon.toFixed(3))
          });
        }
      }

      console.log("🔍 Fetching fresh stops:", gridPoints.length, "grid points…");

      const stopMap = new Map();
      const BATCH = 6;

      for (let i = 0; i < gridPoints.length; i += BATCH) {
        const batch = gridPoints.slice(i, i + BATCH);

        await Promise.all(batch.map(async function (point) {
          const query =
            "{" +
              "nearest(" +
                "latitude: " + point.lat + " " +
                "longitude: " + point.lon + " " +
                "maximumDistance: 8000 " +
                "maximumResults: 30 " +
                "filterByPlaceTypes: [stopPlace] " +
                "filterByModes: [rail, metro, bus, tram, water]" +
              ") {" +
                "edges { node { place { ... on StopPlace { id name latitude longitude transportMode } } } }" +
              "}" +
            "}";

          try {
            const res = await fetch(ENTUR_GRAPHQL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "ET-Client-Name": ENTUR_CLIENT
              },
              body: JSON.stringify({ query: query })
            });

            const data = await res.json();
            const edges = data && data.data && data.data.nearest && data.data.nearest.edges
              ? data.data.nearest.edges
              : [];

            edges.forEach(function (edge) {
              const place = edge && edge.node ? edge.node.place : null;
              if (place && place.id && !stopMap.has(place.id)) {
                stopMap.set(place.id, {
                  id: place.id,
                  name: place.name,
                  lat: place.latitude,
                  lon: place.longitude,
                  mode: place.transportMode
                });
              }
            });
          } catch (err) {
            console.warn("Grid (" + point.lat + "," + point.lon + ") failed:", err.message);
          }
        }));

        setStatus("Loading stops: " + Math.min(i + BATCH, gridPoints.length) + "/" + gridPoints.length + " grid points…");
        await new Promise(function (resolve) { setTimeout(resolve, 150); });
      }

      const stops = Array.from(stopMap.values());
      console.log("📍 Fetched", stops.length, "unique stops");

      try {
        localStorage.setItem(STOPS_LS_KEY, JSON.stringify({
          timestamp: Date.now(),
          stops: stops
        }));
        console.log("💾 Stop list saved to localStorage (" + stops.length + " stops)");
      } catch (err) {
        console.warn("Could not save stops to localStorage (quota exceeded?):", err);
      }

      updateCacheUI();
      return stops;
    }

    async function fetchIsochroneMulti(lon, lat, minutesArray, profileMode) {
      if (!isFinite(lon) || !isFinite(lat)) return [];

      const wait = 320 - (Date.now() - lastMapboxCall);
      if (wait > 0) {
        await new Promise(function (resolve) { setTimeout(resolve, wait); });
      }

      lastMapboxCall = Date.now();

      const contours = minutesArray
        .map(function (m) { return Math.max(1, Math.min(m, 60)); })
        .join(",");

      const profile = getMapboxProfilePath(profileMode);
      const url =
        MAPBOX_ISO_BASE + "/" + profile + "/" + lon + "," + lat +
        "?contours_minutes=" + contours +
        "&polygons=true&denoise=0.5&access_token=" + MAPBOX_TOKEN;

      const res = await fetch(url);
      if (!res.ok) throw new Error("Mapbox " + res.status);

      const data = await res.json();
      return data && data.features ? data.features : [];
    }

    function addIsochroneLayer(geojson, thresholdMin, tooltip, colorOverride) {
      const color = colorOverride || THRESHOLD_COLORS[thresholdMin] || "#888";
      const layer = L.geoJSON(geojson, {
        style: {
          color: color,
          fillColor: color,
          fillOpacity: 0.18,
          weight: 2,
          opacity: 0.8
        }
      }).addTo(map);

      if (tooltip) layer.bindTooltip(tooltip, { sticky: true });
      isochroneLayers.push(layer);
      return layer;
    }

    function addDrilldownLayer(geojson, mins, tooltip, profileMode) {
      const colors = getDrilldownColors(profileMode);
      const color = colors[mins] || "#888";

      const layer = L.geoJSON(geojson, {
        style: {
          color: color,
          fillColor: color,
          fillOpacity: 0.22,
          weight: 2.5,
          opacity: 0.9,
          dashArray: profileMode === "walking" ? "2,5" : "5,4"
        }
      }).addTo(map);

      if (tooltip) layer.bindTooltip(tooltip, { sticky: true });
      drilldownLayers.push(layer);
      return layer;
    }

    function addStopMarker(stop, mins, thresholdMin) {
      const color = THRESHOLD_COLORS[thresholdMin] || "#888";

      const marker = L.circleMarker([stop.lat, stop.lon], {
        radius: 7,
        fillColor: color,
        color: "#fff",
        weight: 1.5,
        fillOpacity: 0.9
      }).addTo(map);

      marker.bindTooltip(
        "<b>" + stop.name + "</b><br>~" + Math.round(mins) + " min transit<br><span style=\"color:#888;font-size:10px\">Click to see drive/walk zones</span>",
        { direction: "top" }
      );

      marker.on("click", function () {
        openDrilldown(stop, mins);
      });

      isochroneLayers.push(marker);
      return marker;
    }

    async function renderDrilldown(stop, transitMins, profileMode) {
      clearDrilldownLayers();
      updateDrilldownToggleUI();

      const verbTitle = profileMode === "walking" ? "walk" : "drive";
      const panel = document.getElementById("drilldown-panel");

      document.getElementById("dd-stop-name").textContent = stop.name;
      document.getElementById("dd-stop-sub").textContent = "~" + Math.round(transitMins) + " min to destination by transit";
      document.getElementById("dd-status").textContent = "Fetching " + verbTitle + " zones...";
      panel.style.display = "block";

      try {
        const features = await fetchIsochroneMulti(stop.lon, stop.lat, [5, 10, 15], profileMode);

        if (!features.length) {
          document.getElementById("dd-status").textContent = "❌ No " + verbTitle + " data returned";
          return;
        }

        currentDrilldownFeaturesByMinute = { 5: null, 10: null, 15: null };

        features
          .slice()
          .sort(function (a, b) {
            const ac = a && a.properties ? a.properties.contour || 0 : 0;
            const bc = b && b.properties ? b.properties.contour || 0 : 0;
            return bc - ac;
          })
          .forEach(function (feat) {
            const mins = feat && feat.properties ? feat.properties.contour : null;
            if (mins) {
              currentDrilldownFeaturesByMinute[mins] = feat;
              addDrilldownLayer(
                feat,
                mins,
                stop.name + ": ≤" + mins + " min " + verbTitle,
                profileMode
              );
            }
          });

        updateFinnLinks(profileMode, stop.name);
        map.panTo([stop.lat, stop.lon]);
        document.getElementById("dd-status").textContent = "Showing 5, 10 & 15 min " + verbTitle + " from " + stop.name;
        renderLegend(getActiveThresholds(), activeMode);
        updateLegendWithDrilldown(profileMode);
      } catch (err) {
        document.getElementById("dd-status").textContent = "❌ " + err.message;
        console.error("Drill-down failed:", err);
      }
    }

    async function openDrilldown(stop, transitMins) {
      currentDrilldownStop = stop;
      currentDrilldownTransitMins = transitMins;
      currentDrilldownMode = "driving";
      updateDrilldownToggleUI();
      await renderDrilldown(stop, transitMins, currentDrilldownMode);
    }

    async function runCar(destination, thresholds) {
      setStatus("Fetching driving isochrones...");

      const features = await fetchIsochroneMulti(destination.lon, destination.lat, thresholds, "driving");
      const ordered = (features || []).slice().reverse();

      ordered.forEach(function (feat, i) {
        const mins = feat && feat.properties ? feat.properties.contour : null;
        const matched = thresholds.find(function (t) { return t === mins; }) || thresholds[i];
        addIsochroneLayer(feat, matched, "≤ " + matched + " min by car");
      });

      setProgress(100);
      setStatus("Done ✓ — " + ordered.length + " driving isochrone(s) rendered");
    }

    async function runTransit(destination, thresholds, rushTime) {
      const stops = await fetchRuterStops();
      if (!stops.length) {
        setStatus("❌ No stops found — check DevTools console");
        return;
      }

      console.log("🚉 Transit mode:", stops.length, "stops →", destination.name, "(" + destination.id + ")");

      const maxThreshold = Math.max.apply(null, thresholds);
      const results = [];
      let nullCount = 0;

      for (let i = 0; i < stops.length; i++) {
        const stop = stops[i];

        if (destination.id && stop.id === destination.id) continue;

        const mins = await fetchMinTransitTime(stop.id, destination, rushTime);

        if (mins === null) {
          nullCount += 1;
        } else if (mins <= maxThreshold + 5) {
          results.push(Object.assign({}, stop, { mins: mins }));
        }

        setProgress(Math.round((i / stops.length) * 100));

        if (i % 5 === 0) {
          setStatus("Querying: " + i + "/" + stops.length + " — " + results.length + " found (" + nullCount + " no data)");
        }
      }

      console.log("📊 Transit:", results.length, "stops with times,", nullCount, "null");

      if (!results.length) {
        setStatus("❌ No transit times found (" + nullCount + " null). Check console.");
        return;
      }

      setStatus("Rendering " + results.length + " stops...");

      results.forEach(function (stop) {
        const matched = thresholds
          .slice()
          .sort(function (a, b) { return a - b; })
          .find(function (t) { return stop.mins <= t; });

        if (matched) {
          addStopMarker(stop, stop.mins, matched);
        }
      });

      setProgress(100);
      setStatus("Done ✓ — " + results.length + " stops shown. Click any to see drive/walk zones.");
      updateCacheUI();
    }

    async function runAnalysis() {
      const btn = document.getElementById("run-btn");
      btn.disabled = true;

      clearLayers();
      document.getElementById("legend").style.display = "none";
      setProgress(1);

      const thresholds = getActiveThresholds();
      if (!thresholds.length) {
        setStatus("Select at least one threshold.");
        btn.disabled = false;
        return;
      }

      const rushTime = document.getElementById("rushTime").value || "07:00";

      if (!MAPBOX_TOKEN || MAPBOX_TOKEN === "YOUR_MAPBOX_TOKEN_HERE" || MAPBOX_TOKEN === "TOKEN_STRING") {
        setStatus("⚠️ Set your Mapbox token at the top of the script.");
        btn.disabled = false;
        return;
      }

      try {
        let destination;

        if (selectedSuggestion && destInput.value === selectedSuggestion.name) {
          destination = selectedSuggestion;
        } else {
          setStatus("Geocoding destination...");
          destination = await geocodeDestination(destInput.value.trim() || "Oslo S");
        }

        selectedSuggestion = null;

        setStatus("📍 Destination: " + destination.name);
        map.setView([destination.lat, destination.lon], 10);

        const destMarker = L.marker([destination.lat, destination.lon])
          .bindPopup("<b>Destination:</b><br>" + destination.name)
          .addTo(map);

        destMarker.openPopup();
        isochroneLayers.push(destMarker);

        if (activeMode === "car") {
          await runCar(destination, thresholds);
        } else {
          await runTransit(destination, thresholds, rushTime);
        }

        renderLegend(thresholds, activeMode);

        const boundsLayers = isochroneLayers
          .map(getLayerBounds)
          .filter(function (b) { return !!b; });

        if (boundsLayers.length) {
          const bounds = boundsLayers.reduce(function (acc, b) {
            return acc.extend(b);
          }, L.latLngBounds([[destination.lat, destination.lon], [destination.lat, destination.lon]]));

          map.fitBounds(bounds, { padding: [40, 40] });
        }
      } catch (err) {
        setStatus("❌ " + err.message);
        console.error("runAnalysis error:", err);
      }

      setProgress(0);
      btn.disabled = false;
    }

    document.querySelectorAll(".mode-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".mode-btn").forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        activeMode = btn.dataset.mode;
      });
    });

    document.querySelectorAll(".thresh-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        btn.classList.toggle("active");
      });
    });

    document.querySelectorAll(".dd-toggle-btn").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        if (!currentDrilldownStop || !currentDrilldownTransitMins) return;

        const nextMode = btn.dataset.ddMode;
        if (nextMode === currentDrilldownMode) return;

        currentDrilldownMode = nextMode;
        updateDrilldownToggleUI();
        await renderDrilldown(currentDrilldownStop, currentDrilldownTransitMins, currentDrilldownMode);
      });
    });

    document.querySelectorAll(".finn-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const url = btn.dataset.url;
        if (!url) return;
        window.open(url, "_blank", "noopener,noreferrer");
      });
    });

    document.getElementById("run-btn").addEventListener("click", runAnalysis);

    document.getElementById("refresh-stops-btn").addEventListener("click", async function () {
      localStorage.removeItem(STOPS_LS_KEY);
      updateCacheUI();
      setStatus("Stop cache cleared — fetching fresh stops from Entur...");

      const btn = document.getElementById("refresh-stops-btn");
      btn.disabled = true;
      btn.textContent = "⏳ Fetching…";

      try {
        const stops = await fetchStopsFromEntur();
        setStatus("✓ Refreshed " + stops.length + " stops and saved to cache");
      } catch (err) {
        setStatus("❌ Refresh failed: " + err.message);
      }

      btn.disabled = false;
      btn.textContent = "↺ Refresh stops";
      updateCacheUI();
    });

    document.getElementById("clear-transit-btn").addEventListener("click", function () {
      const keys = Object.keys(localStorage).filter(function (k) {
        return k.indexOf(CACHE_PREFIX) === 0;
      });

      keys.forEach(function (k) {
        localStorage.removeItem(k);
      });

      setStatus("Transit cache cleared (" + keys.length + " entries removed) ✓");
      updateCacheUI();
    });

    document.getElementById("drilldown-close").addEventListener("click", closeDrilldown);

    destInput.addEventListener("input", function () {
      selectedSuggestion = null;
      clearTimeout(autocompleteTimeout);

      const val = destInput.value.trim();
      if (val.length < 2) {
        suggestionsEl.style.display = "none";
        return;
      }

      autocompleteTimeout = setTimeout(function () {
        fetchSuggestions(val);
      }, 250);
    });

    destInput.addEventListener("blur", function () {
      setTimeout(function () {
        suggestionsEl.style.display = "none";
      }, 200);
    });

    destInput.addEventListener("focus", function () {
      if (suggestionsEl.children.length > 0) {
        suggestionsEl.style.display = "block";
      }
    });

    updateCacheUI();
    seedTransitCacheFromFile();
    updateDrilldownToggleUI();
    resetFinnLinks();
  </script>
</body>
</html>
